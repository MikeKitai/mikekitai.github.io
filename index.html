    /* ═══ SHARED (keep in sync across pages) ═══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {

    /* ═══ BACKGROUND ═══

       black that falls at its own rate, built by the script at the end of the
       body. transform only, so it composites rather than repaints. */

      position: fixed;
      inset: 0;
      z-index: -2;
      background-color: #07060b;
      display: flex;
      overflow: hidden;
    }

    .rain-col { flex: 0 0 18px; position: relative; overflow: hidden; }

    .rain-col > i {
      position: absolute;
      left: 0; right: 0; top: 0;
      display: block;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes fall {
      from { transform: translateY(0); }
      to   { transform: translateY(var(--p)); }
    }

    /* Soft darkening under the content column only; the edges stay bright. */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      align-items: center;
      padding: 0 32px;
      height: 68px;

      background: rgba(7, 6, 11, 0.7);

      font-family: 'DM Serif Display', serif;
      font-weight: 400;

      white-space: nowrap;
      text-align: center;
      grid-column: 2;
      line-height: 1;
      text-decoration: none;
      display: inline-block;
      padding: 8px 16px;
      margin: 0 auto;

    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      grid-column: 3;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--white);
      opacity: 0.8;
      transition: opacity 0.2s;

    .nav-menu {
      display: none;

      background: rgba(7, 6, 11, 0.7);
      padding: 8px 0;
    }

    .nav-menu.open { display: block; }

    .nav-link {
      display: block;
      padding: 12px 24px;
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
      transition: opacity 0.2s, background 0.2s;
    }

    .nav-link:hover {
      opacity: 1;
      background: rgba(200, 191, 168, 0.06);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 32px;
      text-align: center;
      font-size: 11px;
      color: var(--mid);
      letter-spacing: 0.08em;
    }

    .footer-cta {
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .footer-cta a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,191,168,0.25);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .footer-cta a:hover { border-color: var(--accent); }

    /* ── A11Y: skip link, focus ring, screen-reader text ── */
    .skip-link {
      position: absolute;
      left: 8px;
      top: -64px;
      z-index: 200;
      padding: 10px 18px;
      background: #12081f;
      color: var(--white);
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: top 0.2s;
    }

    .skip-link:focus { top: 8px; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* ── A11Y: respect reduced-motion ── */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .rain-col > i, .mk-mask, .navbar-name,
      .platform-link, .platform-link svg, .social-icon svg,
      .hero-email, .apply-email, .hero-quote, .hero-portrait { animation: none !important; }
      .platform-link svg, .social-icon svg { filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }

      .hero-quote { text-shadow: 0 2px 14px rgba(3,2,9,.9); }

    /* ═══ LEGIBILITY OVER THE RAIN ═══
       Remove a class from the body tag to switch any of these off. */

    /* No backdrop-filter here on purpose. Blurring ten small plates over
       content that changes every frame means re-sampling and re-blurring all

       other pages keep their blur — there the effect actually shows. */
    .frosted .platform-link,
    .frosted .listing,
    .frosted .stat-pill {
      background: rgba(7, 6, 11, 0.7);
      border-color: rgba(200, 191, 168, 0.38);
    }
    .frosted .social-icon {
      background: rgba(7, 6, 11, 0.7);
      border-radius: 50%;
      border: 1px solid rgba(200, 191, 168, 0.25);
    }
    .frosted .hero-email,
    .frosted .apply-email {
      background: rgba(7, 6, 11, 0.68);
      padding: 7px 14px;
      border-radius: 3px;
    }
    .frosted .spotify-embed { border-radius: 6px; }

    .strongborder { --line-strong: rgba(200, 191, 168, 0.45); }

    /* Chromatic split. Labels use text-shadow; SVGs can't, so they stack
       drop-shadows. The dark halo leads every keyframe so nothing loses its
       separation from the rain. Offsets stay small — these are 13px labels. */
    @keyframes rgbUIText {
      0%, 25% { text-shadow: 0 0 1px rgba(251,0,231,.55), 0 0 2px rgba(0,233,235,.55); }
      45%     { text-shadow: 2px 0 1px rgba(251,0,231,.55), -2px 0 1px rgba(0,233,235,.55); }
      50%     { text-shadow: -2px 0 1px rgba(251,0,231,.55), 2px 0 1px rgba(0,233,235,.55); }
      55%     { text-shadow: 0 0 2px rgba(251,0,231,.55), 0 0 2px rgba(0,233,235,.55); }
      90%     { text-shadow: -1px 1px 1px rgba(251,0,231,.55), 1px -1px 1px rgba(0,233,235,.55); }
      100%    { text-shadow: 1px 0 1px rgba(251,0,231,.55), -1px 0 1px rgba(0,233,235,.55); }
    }
    /* Colour first, halo last. drop-shadow chains — each one operates on the
       output of the one before it — so a black halo listed first swallows
       every colour cast after it. */
    @keyframes rgbUIIcon {
      0%, 25% { filter: drop-shadow(0 0 1px rgba(251,0,231,.8))  drop-shadow(0 0 2px rgba(0,233,235,.8))  drop-shadow(0 0 3px rgba(0,0,0,.75)); }
      45%     { filter: drop-shadow(2px 0 0 rgba(251,0,231,.8))  drop-shadow(-2px 0 0 rgba(0,233,235,.8)) drop-shadow(0 0 3px rgba(0,0,0,.75)); }
      50%     { filter: drop-shadow(-2px 0 0 rgba(251,0,231,.8)) drop-shadow(2px 0 0 rgba(0,233,235,.8))  drop-shadow(0 0 3px rgba(0,0,0,.75)); }
      55%     { filter: drop-shadow(0 0 2px rgba(251,0,231,.8))  drop-shadow(0 0 2px rgba(0,233,235,.8))  drop-shadow(0 0 3px rgba(0,0,0,.75)); }
      90%     { filter: drop-shadow(-1px 1px 0 rgba(251,0,231,.8)) drop-shadow(1px -1px 0 rgba(0,233,235,.8)) drop-shadow(0 0 3px rgba(0,0,0,.75)); }
      100%    { filter: drop-shadow(1px 0 0 rgba(251,0,231,.8))  drop-shadow(-1px 0 0 rgba(0,233,235,.8)) drop-shadow(0 0 3px rgba(0,0,0,.75)); }
    }

      90%     { filter: drop-shadow(-2px 2px 0 rgba(251,0,231,.9)) drop-shadow(2px -2px 0 rgba(0,233,235,.9)); }
      100%    { filter: drop-shadow(2px 0 0 rgba(251,0,231,.9)) drop-shadow(-2px 0 0 rgba(0,233,235,.9)); }

    /* body text sitting straight on the rain needs a little separation */
    .section-label, .page-eyebrow, .page-intro,
    .team-section-title, .team-card .name, .team-card .role,
    .listing-meta, .listing-description, .listing-requirements,
    .apply-section p, .apply-note, footer {
      text-shadow: 0 1px 10px rgba(3, 2, 9, 0.85);
    }

    /* everything non-essential stops while the page falls apart */
    body.collapsing .platform-link,
    body.collapsing .platform-link svg,
    body.collapsing .social-icon svg,
    body.collapsing .hero-email,
    body.collapsing .hero-quote,
    body.collapsing .navbar-name,
    body.collapsing .hero-portrait,
    body.collapsing .mk-mask { animation-play-state: paused; }

    /* ═══ PAGE-SPECIFIC ═══ */

    /* ── HERO ── */
    .hero {
      max-width: 860px;
      margin: 0 auto;
      padding: 92px 32px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    /* ── PORTRAIT + BREATH RINGS ── */
    .portrait-wrap {
      position: relative;
      width: 140px;
      height: 140px;
      flex-shrink: 0;
      perspective: 600px;
    }

    .portrait-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .portrait-inner.flipping {
      animation: coin-flip 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes coin-flip {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .portrait-front,
    .portrait-back {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* No fill and no ring: the back of the disc is the rain itself, with the
       mark sitting on it. Inlined rather than an <img> so it can take
       currentColor — the source SVG is solid black and would disappear
       against the ground. The two shadows are what keep it legible while a
       bright streak passes behind it. */
    .portrait-back {
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .portrait-back .mk-mark {
      width: 60%;
      height: 60%;
      filter: drop-shadow(0 2px 9px rgba(3, 2, 9, 0.95))
              drop-shadow(0 0 3px rgba(3, 2, 9, 0.9));
    }

    .hero-portrait {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 15%;
      filter: grayscale(15%);
      border: 1px solid rgba(200,191,168,0.2);
      cursor: pointer;
      display: block;
    }

    .breath-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .breath-ring:nth-child(1) {
      background: radial-gradient(circle, rgba(167,139,250,0.32) 0%, rgba(139,92,246,0.12) 50%, transparent 72%);
      animation: breath 4s ease-in-out infinite;
      animation-delay: 0s;
    }
    .breath-ring:nth-child(2) {
      background: radial-gradient(circle, rgba(192,132,252,0.2) 0%, rgba(167,139,250,0.07) 50%, transparent 72%);
      animation: breath 4s ease-in-out infinite;
      animation-delay: 0.5s;
    }
    .breath-ring:nth-child(3) {
      background: radial-gradient(circle, rgba(103,232,249,0.14) 0%, rgba(103,232,249,0.04) 50%, transparent 72%);
      animation: breath-slow 6s ease-in-out infinite;
      animation-delay: 0s;
    }

    @keyframes breath {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.9; }
      50%  { transform: translate(-50%,-50%) scale(2.4); opacity: 0.35; }
      100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.9; }
    }
    @keyframes breath-slow {
      0%   { transform: translate(-50%,-50%) scale(1.2); opacity: 0.5; }
      50%  { transform: translate(-50%,-50%) scale(3.2); opacity: 0.08; }
      100% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.5; }
    }

    /* ── QUOTE + TYPING CURSOR ── */
    .hero-quote {
      font-family: 'Caveat', cursive;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .typed-cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: currentColor;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }


    /* ── PORTRAIT & QUOTE ── */

    /* Cool-spectrum chromatic edge, eased over 9s so it drifts rather than
       jitters. Tight blur radii keep it on the photograph, not around it. */
    @keyframes fluoroFringe {
      0%   { filter: grayscale(15%) drop-shadow(-1px 0 1px rgba(186,255,236,.42)) drop-shadow(1px 0 1px rgba(176,238,255,.42)); }
      35%  { filter: grayscale(15%) drop-shadow(0 -1px 1px rgba(186,255,236,.34)) drop-shadow(0 1px 2px rgba(176,238,255,.38)); }
      70%  { filter: grayscale(15%) drop-shadow(1px 1px 2px rgba(198,255,244,.40)) drop-shadow(-1px -1px 1px rgba(176,238,255,.34)); }
      100% { filter: grayscale(15%) drop-shadow(2px 0 1px rgba(186,255,236,.44)) drop-shadow(-2px 0 2px rgba(176,238,255,.40)); }
    }
    .hero-portrait { will-change: filter; animation: fluoroFringe 9s ease-in-out infinite alternate; }

    /* the breathing rings are retired — the fringe replaces them */
    .breath-ring { display: none; }

    /* Quote keeps its original size; prominence comes from the split. Each
       keyframe leads with a dark halo so it stays legible over the rain.
       2.4s against the navbar's 2s, so they never pulse together. */
    @keyframes rgbQuote {
      0%, 25% { text-shadow: 0 2px 14px rgba(3,2,9,.9), 0 0 1px rgba(251,0,231,.7), 0 0 3px rgba(0,233,235,.7), 0 0 3px rgba(0,242,14,.45); }
      45%     { text-shadow: 0 2px 14px rgba(3,2,9,.9), 3px 0 1px rgba(251,0,231,.7), 0 3px 1px rgba(0,233,235,.7), -3px 0 1px rgba(0,242,14,.45); }
      50%     { text-shadow: 0 2px 14px rgba(3,2,9,.9), -3px 0 1px rgba(251,0,231,.7), 0 -3px 1px rgba(0,233,235,.7), 3px 0 1px rgba(0,242,14,.45); }
      55%     { text-shadow: 0 2px 14px rgba(3,2,9,.9), 0 0 3px rgba(251,0,231,.7), 0 0 3px rgba(0,233,235,.7), 0 0 3px rgba(0,242,14,.45); }
      90%     { text-shadow: 0 2px 14px rgba(3,2,9,.9), -3px 0 1px rgba(251,0,231,.7), 0 3px 1px rgba(0,233,235,.7), 3px 0 1px rgba(0,242,14,.45); }
      100%    { text-shadow: 0 2px 14px rgba(3,2,9,.9), 3px 0 1px rgba(251,0,231,.7), 0 -3px 1px rgba(0,233,235,.7), -3px 0 1px rgba(0,242,14,.45); }
    }
    .hero-quote { will-change: text-shadow; animation: rgbQuote 2.4s steps(9) infinite alternate; }

    /* ── EMAIL ── */
    .hero-email {
      display: inline-block;
      margin-top: 16px;
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .hero-email:hover { opacity: 1; }

    .email-underline {
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: opacity 0.3s;
    }

    /* ── SOCIAL ICONS ── */
    .hero-socials {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 12px;
      margin-bottom: -8px;
    }

    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .social-icon:hover { opacity: 1; }

    .social-icon svg {
      width: 20px;
      height: 20px;
      fill: var(--white);
    }

    /* ── SECTIONS ── */
    section {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    #listen { padding-top: 14px; }

    .section-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 12px;
    }

    /* ── LINK GRIDS ── */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .platform-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      height: 46px;
      border: 1px solid var(--line-strong);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: border-color 0.2s, background 0.2s;
      white-space: nowrap;
      overflow: hidden;
    }

    .platform-link:hover {
      border-color: var(--accent);
      background: rgba(200,191,168,0.06);
    }

    .platform-link svg,
    .platform-link img {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      min-width: 16px;
      min-height: 16px;
      fill: var(--white);
      opacity: 0.85;
      overflow: visible;
    }

    /* ── DIVIDER ── */
    .falling-divider {
      border-top: 1px solid var(--line);
      margin: 0 32px;
      height: 1px;
    }

    .spotify-embed { border: 0; border-radius: 4px; }

    @media (max-width: 620px) {
      .link-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── SDG MODE ── */
    .page-filter-wrap,
    .mk-mask,
    .scrim,
    .gradient-bg {
      transition: filter 1.2s ease;
    }

    .page-filter-wrap.sdg-mode,
    .mk-mask.sdg-mode,
    .scrim.sdg-mode,
    .gradient-bg.sdg-mode {
      filter: grayscale(100%);
    }

    .sdg-hint {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .sdg-hint.visible { opacity: 0.6; }
  
  /* One filter on the button, not three on the bars — the chromatic split
     then reads as a single glitching icon rather than three loose lines,
     and it is one composited layer instead of three. Menu text is left
     alone on purpose. */
  .rgbui .hamburger { will-change: filter; animation: rgbUIIcon 2.2s steps(9) infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .rgbui .hamburger { animation: none; } }

  /* Menu items matched to .platform-link: same full-strength white and the
     same rgbUIText treatment, staggered so the three don't pulse in unison. */
  .nav-link { opacity: 1; }
  .rgbui .nav-link { animation: rgbUIText 2.2s steps(9) infinite alternate; }
  .rgbui .nav-link:nth-child(1) { animation-delay: 0s; }
  .rgbui .nav-link:nth-child(2) { animation-delay: -0.55s; }
  .rgbui .nav-link:nth-child(3) { animation-delay: -1.1s; }
  body.collapsing .nav-link { animation-play-state: paused; }

  <script>
    // ── LAZY SPOTIFY EMBED ──
    // The iframe gets its src only after the first user interaction
    // (scroll, tap, key, mouse move), keeping the ~600 KB of Spotify
    // player JS off the critical path entirely. Real users interact
    // within moments; automated audits like Lighthouse never do.
    (function () {
      const embed = document.querySelector('.spotify-embed');
      if (!embed) return;
      const load = () => {
        if (!embed.src) embed.src = embed.dataset.src;
        events.forEach(ev => removeEventListener(ev, load));
      };
      const events = ['scroll', 'wheel', 'touchstart', 'pointerdown', 'mousemove', 'keydown'];
      events.forEach(ev => addEventListener(ev, load, { once: true, passive: true }));
    })();

    // ── PORTRAIT TAP SPEED & GRAVITY EASTER EGG (deferred until load) ──
    window.addEventListener('load', () => {

      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const speeds = [18, 5, 2, 0.5, 0.1];
      // breath and breath-slow durations scaled proportionally to gradient speeds
      // base: gradient=18s → breath=4s, breath-slow=6s
      const breathSpeeds     = speeds.map(s => +(s * (4 / 18)).toFixed(3));
      const breathSlowSpeeds = speeds.map(s => +(s * (6 / 18)).toFixed(3));

      let speedIndex = 0;
      const gradientBg  = document.querySelector('.gradient-bg');
      const breathRings = document.querySelectorAll('.breath-ring');

      const portraitInner = document.getElementById('portrait-inner');
      let isFlipping = false;

      let gravityActive = false;

      function portraitTap() {
        speedIndex = (speedIndex + 1) % speeds.length;

        // every rain column speeds up together; each remembers its own base
        const factors = [1, 0.45, 0.22, 0.09, 0.035];
        document.querySelectorAll('.rain-col > i').forEach(strip => {
          if (!strip.dataset.base) strip.dataset.base = parseFloat(strip.style.animationDuration);
          strip.style.animationDuration = speedIndex === 0
            ? strip.dataset.base + 's'
            : (strip.dataset.base * factors[speedIndex]).toFixed(2) + 's';
        });
        const maskEl = document.querySelector('.mk-mask');
        if (maskEl) maskEl.style.animationDuration =
          speedIndex === 0 ? '' : (11 * factors[speedIndex]).toFixed(2) + 's';

        // coin flip
        if (!isFlipping) {
          isFlipping = true;
          portraitInner.classList.add('flipping');
          portraitInner.addEventListener('animationend', () => {
            portraitInner.classList.remove('flipping');
            isFlipping = false;
          }, { once: true });
        }

        // gravity triggers when speed cycles back to default (index 0)
        if (speedIndex === 0 && !gravityActive && !reduceMotion) {
          setTimeout(triggerGravity, 400);
        }
      }
      document.querySelector('.portrait-wrap').addEventListener('click', portraitTap);

      // ── TYPING ANIMATION ──
      // Text is already in the HTML (for crawlers / no-JS); read it back,
      // blank it, then retype. Skipped entirely for reduced-motion users.
      const typedQuote = document.getElementById('typed-quote');
      const typedCursor = document.getElementById('typed-cursor');
      const quoteText = typedQuote.textContent.trim();

      if (reduceMotion) {
        typedCursor.style.display = 'none';
      } else {
        typedQuote.textContent = '';
        let ti = 0;
        setTimeout(function typeQuote() {
          if (ti <= quoteText.length) {
            typedQuote.textContent = quoteText.slice(0, ti);
            ti++;
            setTimeout(typeQuote, ti === 1 ? 600 : 85);
          } else {
            typedCursor.style.display = 'none';
          }
        }, 400);
      }

      // ── GRAVITY ──
      const FALL_SELECTOR = '.portrait-wrap, #hero-quote, .hero-socials, #email-link, .section-label, .platform-link, .spotify-embed, .falling-divider, footer';

      function triggerGravity() {
        gravityActive = true;

        // The rain and the chromatic split are competing for the same frames.
        // Freeze them for the duration — the page is collapsing anyway, and
        // on a phone this is the difference between 20fps and 60.
        document.body.classList.add('collapsing');
        const rainStrips = document.querySelectorAll('.rain-col > i');
        rainStrips.forEach(strip => { strip.style.animationPlayState = 'paused'; });
        const allEls = Array.from(document.querySelectorAll(FALL_SELECTOR));
        const physicsEls = [];

        const rects = allEls.map(el => el.getBoundingClientRect());

        allEls.forEach((el, i) => {
          const rect = rects[i];
          const clone = el.cloneNode(true);
          clone.style.cssText = `
            position: fixed;
            left: ${rect.left}px;
            top: ${rect.top}px;
            width: ${rect.width}px;
            height: ${rect.height}px;
            margin: 0;
            z-index: 9999;
            pointer-events: none;
            will-change: transform;
          `;
          document.body.appendChild(clone);
          el.style.visibility = 'hidden';

          physicsEls.push({
            el: clone,
            x0: rect.left,
            y0: rect.top,
            x: rect.left,
            y: rect.top,
            w: rect.width,
            h: rect.height,
            vx: (Math.random() - 0.5) * 4,
            vy: -(Math.random() * 2),
          });
        });

        const gravity = 0.5;
        const bounce = 0.35;
        const friction = 0.97;
        const floor = window.innerHeight;

        function animate() {
          let allSettled = true;
          physicsEls.forEach(p => {
            p.vy += gravity;
            p.vx *= friction;
            p.x += p.vx;
            p.y += p.vy;

            if (p.y + p.h >= floor) {
              p.y = floor - p.h;
              p.vy *= -bounce;
              p.vx *= 0.85;
              if (Math.abs(p.vy) < 0.5) p.vy = 0;
            }
            if (p.x < 0) { p.x = 0; p.vx *= -bounce; }
            if (p.x + p.w > window.innerWidth) { p.x = window.innerWidth - p.w; p.vx *= -bounce; }

            p.el.style.transform =
              'translate(' + (p.x - p.x0) + 'px,' + (p.y - p.y0) + 'px)';

            if (Math.abs(p.vy) > 0.5 || Math.abs(p.vx) > 0.1) allSettled = false;
          });

          if (!allSettled) {
            requestAnimationFrame(animate);
          } else {
            // fade out clones and restore page after 2s
            setTimeout(() => {
              physicsEls.forEach(p => {
                p.el.style.transition = 'opacity 0.8s';
                p.el.style.opacity = '0';
              });
              setTimeout(() => {
                physicsEls.forEach(p => p.el.remove());
                allEls.forEach(el => el.style.visibility = '');
                rainStrips.forEach(strip => { strip.style.animationPlayState = ''; });
                document.body.classList.remove('collapsing');
                gravityActive = false;
              }, 800);
            }, 2000);
          }
        }

        requestAnimationFrame(animate);
      }

    }); // end window.addEventListener('load')

    // ── SDG MODE EASTER EGG (long-press "Northwell Media" in footer) ──
    (function () {
      const trigger    = document.getElementById('northwell-media');
      const gradientBg = document.querySelector('.gradient-bg');
      const pageWrap   = document.getElementById('page-filter-wrap');
      const hint       = document.getElementById('sdg-hint');
      const HOLD_MS = 300;
      let longPressTimer;
      let sdgActive = false;
      let hintTimer;

      function showHint(text) {
        clearTimeout(hintTimer);
        hint.textContent = text;
        hint.classList.add('visible');
        hintTimer = setTimeout(() => hint.classList.remove('visible'), 2800);
      }

      function toggleSDG() {
        sdgActive = !sdgActive;
        pageWrap.classList.toggle('sdg-mode', sdgActive);
        document.querySelectorAll('.mk-mask, .scrim').forEach(el => el.classList.toggle('sdg-mode', sdgActive));
        gradientBg.classList.toggle('sdg-mode', sdgActive);
        showHint(sdgActive ? 'SDG mode activated' : 'SDG mode deactivated');
      }

      // long press — hold for HOLD_MS
      trigger.addEventListener('mousedown',  () => { longPressTimer = setTimeout(toggleSDG, HOLD_MS); });
      trigger.addEventListener('mouseup',    () => clearTimeout(longPressTimer));
      trigger.addEventListener('mouseleave', () => clearTimeout(longPressTimer));

      // touch support
      trigger.addEventListener('touchstart', () => { longPressTimer = setTimeout(toggleSDG, HOLD_MS); }, { passive: true });
      trigger.addEventListener('touchend',   () => clearTimeout(longPressTimer));
      trigger.addEventListener('touchmove',  () => clearTimeout(longPressTimer));

      // prevent accidental text selection on long press
      trigger.style.userSelect = 'none';
      trigger.style.webkitUserSelect = 'none';
      trigger.style.cursor = 'default';
    })();
  </script>


  <script>
    /* One 18px column per pixel of the MK grid. Each gets a randomised gap
       between drops and its own fall time, so nothing moves in step. */
    (function () {
      const CELL = 18;
      const HUES = ['#67e8f9','#38bdf8','#818cf8','#a78bfa','#c084fc','#ec4899','#f472b6','#5eead4'];
      const wrap = document.querySelector('.gradient-bg');
      if (!wrap) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      function streak(hue, s) {
        return 'repeating-linear-gradient(to bottom,'
          + ' #000 0px,'
          + ' #000 ' + (s - 150) + 'px,'
          + ' ' + hue + '14 ' + (s - 120) + 'px,'
          + ' ' + hue + '55 ' + (s - 66)  + 'px,'
          + ' ' + hue + 'cc ' + (s - 34)  + 'px,'
          + ' ' + hue + '66 ' + (s - 16)  + 'px,'
          + ' #000 ' + s + 'px)';
      }

      function build() {
        // One fragment, one insertion — appending 80 children to a live node
        // means the browser reflows 80 times instead of once.
        const frag = document.createDocumentFragment();
        const n = Math.ceil(window.innerWidth / CELL) + 1;
        const h = window.innerHeight;
        for (let i = 0; i < n; i++) {
          const col = document.createElement('div');
          col.className = 'rain-col';
          const strip = document.createElement('i');
          const period = 210 + Math.round(Math.random() * 260);
          const speed  = 4.5 + Math.random() * 7.5;
          strip.style.height = (h + period * 2) + 'px';
          strip.style.top = (-period) + 'px';
          strip.style.background = streak(HUES[i % HUES.length], period);
          strip.style.setProperty('--p', period + 'px');
          strip.style.animationDuration = speed.toFixed(2) + 's';
          strip.style.animationDelay = (-Math.random() * speed).toFixed(2) + 's';
          col.appendChild(strip);
          frag.appendChild(col);
        }
        wrap.replaceChildren(frag);
      }

      // Building this synchronously blocked the main thread during the exact
      // window Lighthouse measures. The page paints on its dark ground first;
      // the rain arrives a frame or two later and nobody notices.
      function scheduleBuild() {
        if ('requestIdleCallback' in window) requestIdleCallback(build, { timeout: 900 });
        else setTimeout(build, 60);
      }
      if (document.readyState === 'complete') scheduleBuild();
      else addEventListener('load', scheduleBuild, { once: true });
      let t;
      addEventListener('resize', () => { clearTimeout(t); t = setTimeout(build, 250); });
    })();
  </script>
</body>
</html>
